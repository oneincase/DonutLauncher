<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>甜甜圈控制台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <svg id="donut" viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg">
      <g id="spin-group">
        <g id="rings"></g>
        <g id="icons"></g>
      </g>
      <g id="center"></g>
    </svg>

    <input id="search-input" class="search-box hidden" type="text" placeholder="搜索应用">
    <div id="grid-view" class="layout-view hidden"></div>
    <div id="list-view" class="layout-view hidden"></div>

    <div id="empty-state" class="hidden">
      <p id="empty-message">暂无应用</p>
      <button id="open-settings">打开设置</button>
    </div>
  </div>

  <div id="settings-panel" class="hidden">
    <h2>设置</h2>
    <p id="shortcut-error" class="hidden"></p>
    <label>
      快捷键
      <input id="shortcut-input" type="text" value="Option+Space">
    </label>
    <label>
      布局
      <select id="layout-input">
        <option value="ring">圆环</option>
        <option value="grid">网格</option>
        <option value="list">列表</option>
      </select>
    </label>
    <label>
      图标尺寸
      <input id="icon-size-input" type="range" min="32" max="96" step="4">
    </label>
    <label>
      圆环透明度
      <input id="opacity-input" type="range" min="0" max="1" step="0.05">
    </label>
    <label>
      圆环粗细
      <input id="stroke-input" type="range" min="0.5" max="6" step="0.5">
    </label>
    <label>
      旋转速度
      <input id="rotation-speed-input" type="range" min="0" max="3" step="0.25">
    </label>
    <label class="checkbox">
      <input id="rotation-input" type="checkbox">
      开启圆环缓慢旋转
    </label>
    <label class="checkbox">
      <input id="search-toggle-input" type="checkbox">
      显示搜索框
    </label>
    <label>
      排序方式
      <select id="sort-input">
        <option value="name">名称</option>
        <option value="recent">最近使用</option>
        <option value="favorites">收藏优先</option>
      </select>
    </label>
    <label>
      圆环颜色（逗号分隔）
      <input id="colors-input" type="text">
    </label>
    <label>
      扫描路径（每行一个）
      <textarea id="paths-input" rows="3"></textarea>
    </label>
    <label>
      排除应用（每行一个名称）
      <textarea id="excluded-input" rows="3"></textarea>
    </label>
    <div class="settings-actions">
      <button id="refresh-btn">刷新应用</button>
      <button id="save-btn">保存</button>
      <button id="close-btn">关闭</button>
    </div>
  </div>

  <script src="donut-layout.js"></script>
  <script src="grid-layout.js"></script>
  <script src="list-layout.js"></script>
  <script src="app-list-utils.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
