<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>甜甜圈控制台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <svg id="donut" viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg">
      <g id="spin-group">
        <g id="rings"></g>
        <g id="icons"></g>
      </g>
      <g id="center"></g>
    </svg>
    <div id="empty-state" class="hidden">
      <p>暂无应用</p>
      <button id="open-settings">打开设置</button>
    </div>
  </div>

  <div id="settings-panel" class="hidden">
    <h2>设置</h2>
    <label>
      快捷键
      <input id="shortcut-input" type="text" value="Option+Space">
    </label>
    <label>
      圆环透明度
      <input id="opacity-input" type="range" min="0" max="1" step="0.05">
    </label>
    <label>
      圆环粗细
      <input id="stroke-input" type="range" min="0.5" max="6" step="0.5">
    </label>
    <label>
      圆环颜色（逗号分隔）
      <input id="colors-input" type="text">
    </label>
    <label>
      扫描路径（每行一个）
      <textarea id="paths-input" rows="4"></textarea>
    </label>
    <label class="checkbox">
      <input id="rotation-input" type="checkbox">
      开启圆环缓慢旋转
    </label>
    <div class="settings-actions">
      <button id="refresh-btn">刷新应用</button>
      <button id="save-btn">保存</button>
      <button id="close-btn">关闭</button>
    </div>
  </div>

  <script src="donut-layout.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
